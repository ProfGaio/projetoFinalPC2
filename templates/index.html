<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Hamburgueria 2º M-Tec Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">🍔 Cardápio da Hamburgueria</h1>
        
        <div class="text-center mb-4">
            <a href="/adicionar" class="btn btn-success btn-lg">Cadastrar Novo Lanche</a>
        </div>

        <div class="row">
            <!-- Aqui usamos um laço de repetição do Jinja2 (similar ao Python) -->
            {% for lanche in itens %}
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ lanche.nome }}</h5>
                        <h6 class="card-subtitle mb-2 text-success">R$ {{ lanche.preco }}</h6>
                        <p class="card-text">
                            <strong>Ingredientes:</strong><br>
                            <!-- Join é um filtro para juntar a lista em texto -->
                            {{ lanche.ingredientes | join(', ') }}
                        </p>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-12 text-center">
                <p class="text-muted">Nenhum lanche cadastrado ainda.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
