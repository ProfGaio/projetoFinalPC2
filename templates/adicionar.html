<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h3 class="mb-0">Novo Item</h3>
                    </div>
                    <div class="card-body">
                        <form action="/adicionar" method="POST">
                            
                            <!-- Seleção do Tipo (Lanche ou Bebida) -->
                            <div class="mb-3">
                                <label class="form-label">O que você vai cadastrar?</label>
                                <select name="tipo_item" id="tipoSelect" class="form-select" onchange="atualizarCampos()">
                                    <option value="lanche">Lanche</option>
                                    <option value="bebida">Bebida</option>
                                </select>
                            </div>

                            <!-- Campos Comuns -->
                            <div class="mb-3">
                                <label class="form-label">Nome:</label>
                                <input type="text" name="nome" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Preço (R$):</label>
                                <input type="number" step="0.01" name="preco" class="form-control" required>
                            </div>

                            <!-- Campo Específico de LANCHE -->
                            <div class="mb-3" id="campoIngredientes">
                                <label class="form-label">Ingredientes (separados por vírgula):</label>
                                <input type="text" name="ingredientes" class="form-control">
                            </div>

                            <!-- Campo Específico de BEBIDA (Inicialmente escondido) -->
                            <div class="mb-3 d-none" id="campoTamanho">
                                <label class="form-label">Tamanho (ml):</label>
                                <input type="text" name="tamanho" class="form-control">
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Salvar</button>
                                <a href="/" class="btn btn-secondary">Voltar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script simples para alternar os campos -->
    <script>
        function atualizarCampos() {
            let tipo = document.getElementById('tipoSelect').value;
            if (tipo === 'lanche') {
                document.getElementById('campoIngredientes').classList.remove('d-none');
                document.getElementById('campoTamanho').classList.add('d-none');
            } else {
                document.getElementById('campoIngredientes').classList.add('d-none');
                document.getElementById('campoTamanho').classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
